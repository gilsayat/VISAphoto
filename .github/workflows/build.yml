name: Build USVisaPhotoAutomator EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Clean publish step relying on .csproj for all parameters
      - name: Publish slim single-file EXE
        run: dotnet publish -c Release -r win-x64 -o ./Publish

      - name: Create Models placeholder folder in Publish output
        run: New-Item -ItemType Directory -Force -Path ./Publish/Models

      - name: Download Offline AI Models
        run: |
          curl.exe -L -o ./wwwroot/bundle.js https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/dist/browser/bundle.js
          curl.exe -L -o ./wwwroot/isnet_fp16.onnx https://static.imgly.com/@imgly/background-removal/1.7.0/dist/isnet_fp16.onnx
          curl.exe -L -o ./wwwroot/ort-wasm.wasm https://static.imgly.com/@imgly/background-removal/1.7.0/dist/ort-wasm.wasm
          curl.exe -L -o ./wwwroot/ort-wasm-simd.wasm https://static.imgly.com/@imgly/background-removal/1.7.0/dist/ort-wasm-simd.wasm
          curl.exe -L -o ./wwwroot/ort-wasm-threaded.wasm https://static.imgly.com/@imgly/background-removal/1.7.0/dist/ort-wasm-threaded.wasm
          curl.exe -L -o ./wwwroot/ort-wasm-simd-threaded.wasm https://static.imgly.com/@imgly/background-removal/1.7.0/dist/ort-wasm-simd-threaded.wasm

      - name: Copy wwwroot to Publish output
        run: Copy-Item -Path ./wwwroot -Destination ./Publish/wwwroot -Recurse -Force

      - name: Upload USVisaPhotoAutomator EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: USVisaPhotoAutomator-maxquality-win-x64
          path: ./Publish/
          retention-days: 30
